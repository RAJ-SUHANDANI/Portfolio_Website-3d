name: Capture AuditAI website preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-auditai.yml'

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install screenshot browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture live AuditAI landing page
        run: |
          mkdir -p public/project-previews
          npx playwright screenshot --browser chromium --viewport-size "1365,900" --wait-for-timeout 5000 https://audit-ai-nine-beta.vercel.app/ public/project-previews/auditai-home.png
          test -s public/project-previews/auditai-home.png
      - name: Commit website capture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/project-previews/auditai-home.png
          if ! git diff --cached --quiet; then
            git commit -m "Capture AuditAI live website preview"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
